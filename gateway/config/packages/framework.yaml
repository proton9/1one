framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    validation:
        enabled: true
    serializer:
        enabled: true
    property_info:
        with_constructor_extractor: true
    http_client:
        default_options:
            timeout: 10

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
